apiVersion: apps/v1
kind: Deployment
metadata:
  name: codify-proxy
  namespace: codify-apps
spec:
  replicas: 1
  selector:
      matchLabels:
        app: codify-proxy
  template:
    metadata:
      labels:
        app: codify-proxy
    spec:
      containers:
        - name: proxy
          image: codify-proxy:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379"
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: codify-proxy-svc
  namespace: codify-apps
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: codify-proxy